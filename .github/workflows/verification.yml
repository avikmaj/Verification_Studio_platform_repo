# Generated by `uvmstudio ci github`. Safe to edit; regenerate to reset.
name: golden_apb verification

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: Regression tier
        default: 'L2'
        type: choice
        options: [L0, L1, L2, L3, L4, L5]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UVM_HOME: ${{ github.workspace }}/third_party/uvm-core/src

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # reproducibility metadata needs real git state

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            verilator z3 git build-essential
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Fetch Accellera UVM
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/accellera-official/uvm-core.git \
            third_party/uvm-core

      - name: Toolchain report
        run: uvmstudio env --json | tee toolchain.json

      - name: Compile / elaborate
        run: uvmstudio compile -p examples/golden_apb --json | tee compile.json

      - name: Lint
        run: uvmstudio lint -p examples/golden_apb --json | tee lint.json
        continue-on-error: true

      - name: Regression
        run: |
          uvmstudio regress -p examples/golden_apb \
            --tier "${{ github.event.inputs.tier || 'L2' }}" \
            --seed 1 -j 2

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            toolchain.json
            compile.json
            lint.json
            examples/golden_apb/results/**/report.*
            examples/golden_apb/results/**/repro.json
            examples/golden_apb/results/**/sim.log
            examples/golden_apb/results/**/*.fst
            examples/golden_apb/results/**/*.vcd
          retention-days: 30
