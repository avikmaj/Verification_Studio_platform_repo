# Generated by `uvmstudio ci gitlab`.
stages: [setup, compile, regress]

variables:
  UVM_HOME: "$CI_PROJECT_DIR/third_party/uvm-core/src"
  GIT_DEPTH: "0"
  TIER: "L2"

default:
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends verilator z3 git python3-pip build-essential
    - pip3 install --break-system-packages -e .
    - test -d third_party/uvm-core || git clone --depth 1 https://github.com/accellera-official/uvm-core.git third_party/uvm-core

toolchain:
  stage: setup
  script:
    - uvmstudio env --json | tee toolchain.json
  artifacts:
    paths: [toolchain.json]

compile:
  stage: compile
  script:
    - uvmstudio compile -p examples/golden_apb --json | tee compile.json
    - uvmstudio lint -p examples/golden_apb --json | tee lint.json || true
  artifacts:
    paths: [compile.json, lint.json]
    when: always

regress:
  stage: regress
  script:
    - uvmstudio regress -p examples/golden_apb --tier "$TIER" --seed 1 -j 2
  artifacts:
    when: always
    paths:
      - examples/golden_apb/results/
    reports:
      junit: examples/golden_apb/results/junit.xml
